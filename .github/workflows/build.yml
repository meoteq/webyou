name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded pull-request runs, but never cancel a tag build midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download bundled PHP
        run: npm run fetch-php
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download bundled PHP
        run: npm run fetch-php
      - name: Build portable zip
        run: npm run dist
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: webyou-windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build AppImage and tar.gz
        shell: bash
        run: |
          set -o pipefail
          npm run dist:linux 2>&1 | tee linux-build.log || {
            status=$?
            {
              echo '### Linux build failed'
              echo ''
              echo '```'
              grep -n -iE 'error|fail|cannot|not found|denied|ENOSPC|EACCES' linux-build.log | tail -n 40 || true
              echo '--- tail ---'
              tail -n 60 linux-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            log_tail=$(tail -n 50 linux-build.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'NR > 1 { printf "%%0A" } { printf "%s", $0 }')
            printf '::error::Linux build failed with exit code %s. Tail: %s\n' "$status" "$log_tail"
            exit 1
          }
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webyou-linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - e2e
      - windows
      - linux
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
